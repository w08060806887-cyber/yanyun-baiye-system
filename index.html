<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>百業戰編排系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",Arial,sans-serif;background:#101010;color:#f1d28a;padding:14px}.wrap{max-width:1200px;margin:auto}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.title{font-size:26px;font-weight:900}.sub{color:#c9a767}.card{border:1px solid #8f6427;background:#15110d;border-radius:10px;padding:14px;margin-bottom:14px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button,textarea{border:1px solid #8f6427;background:#080706;color:#f1d28a;border-radius:6px;padding:10px;font-size:15px}button{background:linear-gradient(#e7c27d,#9f6423);color:#170d05;font-weight:900;cursor:pointer}.btn2{background:#241a0e;color:#f1d28a;border:1px solid #8f6427}.danger{background:#70231d;color:white}.sectionTitle{font-size:20px;font-weight:900;margin-bottom:10px;color:#ffe29b}.vertical{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid #8f6427}.slot{min-height:165px;border-right:1px solid rgba(143,100,39,.6);border-bottom:1px solid rgba(143,100,39,.6);background:#0d0b09}.slot:nth-child(3),.slot:nth-child(6){border-right:none}.slot:nth-child(n+4){border-bottom:none}.slotHead{background:#2a1e10;color:#ffe29b;font-weight:900;text-align:center;padding:9px;border-bottom:1px solid rgba(143,100,39,.6)}.slotBody{padding:8px;min-height:120px}.member{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid rgba(143,100,39,.25);padding:6px 4px;min-height:34px}.member span{line-height:1.4}.member small{color:#aa8a4d}.tag{display:inline-block;border-radius:4px;color:white;padding:2px 7px;font-size:13px;font-weight:900;margin-right:4px}.霖霖{background:#39783a}.雙扇{background:#315b94}.八方奶{background:#77ac43}.威威{background:#8d322a}.陌奶{background:#9a6a38}.唐陌{background:#8a6d45}.影影{background:#60458a}.鳳鳳{background:#6f4a9b}.虹虹{background:#a02e87}.雙劍{background:#6b4b15}.玉玉{background:#40804a}.釣釣{background:#a07d18}.x{width:auto;padding:2px 7px;background:#3a1714;color:#fff}.horizontal{border:1px solid #8f6427}.hrow{display:grid;grid-template-columns:90px 1fr;min-height:48px;border-bottom:1px solid rgba(143,100,39,.4)}.hrow:last-child{border-bottom:none}.hlabel{background:#2a1e10;color:#ffe29b;font-weight:900;display:flex;align-items:center;justify-content:center}.hcontent{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pool{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #8f6427;background:#0d0b09;border-radius:6px;padding:8px;display:flex;gap:8px;align-items:center}.chip select{height:34px;padding:5px}.muted{color:#9f8757}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.copyBox{width:100%;height:150px;line-height:1.5}.notice{font-size:13px;color:#bfa36e;margin-top:8px}.empty{color:#6d6250;padding:8px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{border:1px solid rgba(143,100,39,.5);padding:8px 10px;border-radius:6px;background:#0d0b09}@media(max-width:900px){.vertical{grid-template-columns:1fr}.slot{border-right:none!important;border-bottom:1px solid rgba(143,100,39,.6)!important}.slot:last-child{border-bottom:none!important}.grid2{grid-template-columns:1fr}.hrow{grid-template-columns:70px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">百業戰 編排系統</div><div class="sub">直式／橫式同步編排</div></div>
    <div class="bar"><input id="date" value="05/23(六)" style="width:120px"><input id="time" value="20:30" style="width:100px"><button onclick="saveData()">儲存</button><button class="btn2" onclick="loadSample()">載入範例</button><button class="danger" onclick="clearAll()">清空</button></div>
  </div>

  <div class="card">
    <div class="sectionTitle">未編排人員</div>
    <div class="bar" style="margin-bottom:10px">
      <input id="name" placeholder="角色名稱" style="min-width:160px">
      <select id="school">
        <option value="霖霖">霖霖</option><option value="雙扇">雙扇</option><option value="八方奶">八方奶</option><option value="威威">威威</option><option value="陌奶">陌奶</option><option value="唐陌">唐陌</option><option value="影影">影影</option><option value="鳳鳳">鳳鳳</option><option value="虹虹">虹虹</option><option value="雙劍">雙劍</option><option value="玉玉">玉玉</option><option value="釣釣">釣釣</option>
      </select>
      <button onclick="addMember()">新增人員</button>
    </div>
    <div id="pool" class="pool"></div>
    <div class="notice">把人員指派到 A1～B3 後，下面「直式」和「橫式」會同步更新。</div>
  </div>

  <div class="grid2">
    <div>
      <div class="card">
        <div class="sectionTitle">直式編排（戰場視角）</div>
        <div class="vertical" id="vertical"></div>
      </div>
      <div class="card">
        <div class="sectionTitle">橫式編排（列表視角）</div>
        <div class="horizontal" id="horizontal"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="sectionTitle">統計</div>
        <div id="stats" class="stats"></div>
      </div>
      <div class="card">
        <div class="sectionTitle">複製文字</div>
        <textarea id="copyText" class="copyBox" readonly></textarea>
        <button style="margin-top:8px" onclick="copyOut()">複製編排</button>
      </div>
    </div>
  </div>
</div>
<script>
const slots=["A1","A2","A3","B1","B2","B3"];
let members=[];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function addMember(){const name=document.getElementById('name').value.trim();const school=document.getElementById('school').value;if(!name)return alert('請輸入角色名稱');members.push({id:uid(),name,school,slot:'未編排'});document.getElementById('name').value='';render();saveData(false)}
function moveMember(id,slot){const m=members.find(x=>x.id===id);if(m)m.slot=slot;render();saveData(false)}
function delMember(id){members=members.filter(x=>x.id!==id);render();saveData(false)}
function memberHTML(m){return `<div class="member"><span><span class="tag ${m.school}">${m.school}</span>${m.name}</span><button class="x" onclick="delMember('${m.id}')">×</button></div>`}
function renderPool(){const el=document.getElementById('pool');const pool=members.filter(m=>m.slot==='未編排');el.innerHTML=pool.length?pool.map(m=>`<div class="chip"><span><span class="tag ${m.school}">${m.school}</span>${m.name}</span><select onchange="moveMember('${m.id}',this.value)"><option value="未編排">未編排</option>${slots.map(s=>`<option value="${s}">${s}</option>`).join('')}</select><button class="x" onclick="delMember('${m.id}')">×</button></div>`).join(''):'<div class="muted">目前沒有未編排人員</div>'}
function renderVertical(){const el=document.getElementById('vertical');el.innerHTML=slots.map(s=>{const list=members.filter(m=>m.slot===s);return `<div class="slot"><div class="slotHead">${s}${s==='A1'||s==='B1'?'(左)':s==='A2'||s==='B2'?'(中)':'(右)'}</div><div class="slotBody">${list.length?list.map(memberHTML).join(''):'<div class="empty">空位</div>'}</div></div>`}).join('')}
function renderHorizontal(){const el=document.getElementById('horizontal');el.innerHTML=slots.map(s=>{const list=members.filter(m=>m.slot===s);return `<div class="hrow"><div class="hlabel">${s}</div><div class="hcontent">${list.length?list.map(m=>`<span><span class="tag ${m.school}">${m.school}</span>${m.name}</span>`).join(''):'<span class="muted">空位</span>'}</div></div>`}).join('')}
function renderStats(){const el=document.getElementById('stats');const total=members.length;const assigned=members.filter(m=>m.slot!=='未編排').length;el.innerHTML=`<div class="stat">總人數：${total}</div><div class="stat">已編排：${assigned}</div><div class="stat">未編排：${total-assigned}</div>`+slots.map(s=>`<div class="stat">${s}：${members.filter(m=>m.slot===s).length}</div>`).join('')}
function renderCopy(){const date=document.getElementById('date').value;const time=document.getElementById('time').value;let text=`${date}  開始時間：${time}\n\n直式\n`;for(const s of slots){const list=members.filter(m=>m.slot===s).map(m=>`${m.school}：${m.name}`).join('、')||'空位';text+=`${s}：${list}\n`}text+=`\n未編排\n`+(members.filter(m=>m.slot==='未編排').map(m=>`${m.school}：${m.name}`).join('、')||'無');document.getElementById('copyText').value=text}
function render(){renderPool();renderVertical();renderHorizontal();renderStats();renderCopy()}
function saveData(show=true){localStorage.setItem('baiyeArrangeData',JSON.stringify({members,date:document.getElementById('date').value,time:document.getElementById('time').value}));if(show)alert('已儲存')}
function loadData(){const raw=localStorage.getItem('baiyeArrangeData');if(raw){try{const d=JSON.parse(raw);members=d.members||[];document.getElementById('date').value=d.date||'05/23(六)';document.getElementById('time').value=d.time||'20:30'}catch(e){}}render()}
function clearAll(){if(confirm('確定清空編排？')){members=[];render();saveData(false)}}
function copyOut(){navigator.clipboard.writeText(document.getElementById('copyText').value).then(()=>alert('已複製'))}
function loadSample(){members=[
{id:uid(),school:'霖霖',name:'上官鶯鶯',slot:'A2'},{id:uid(),school:'虹虹',name:'神奇的地鼠',slot:'A2'},{id:uid(),school:'釣釣',name:'司徒炎熾',slot:'A3'},{id:uid(),school:'虹虹',name:'咩寶',slot:'A3'},{id:uid(),school:'虹虹',name:'GoCola',slot:'A3'},
{id:uid(),school:'鳳鳳',name:'文豪野喵',slot:'A1'},{id:uid(),school:'釣釣',name:'月淮',slot:'A1'},{id:uid(),school:'霖霖',name:'零嘎',slot:'B1'},{id:uid(),school:'威威',name:'上官喵喵',slot:'B1'},{id:uid(),school:'釣釣',name:'凌云',slot:'B1'},
{id:uid(),school:'雙扇',name:'阿奇拉（風牆）',slot:'B2'},{id:uid(),school:'霖霖',name:'玖煞',slot:'B2'},{id:uid(),school:'威威',name:'周老師',slot:'B2'},{id:uid(),school:'霖霖',name:'敏藝',slot:'B3'},{id:uid(),school:'陌霖',name:'雙魚兒',slot:'B3'},{id:uid(),school:'玉玉',name:'美妮',slot:'B3'}
].map(m=>({...m, school: ['霖霖','雙扇','八方奶','威威','陌奶','唐陌','影影','鳳鳳','虹虹','雙劍','玉玉','釣釣'].includes(m.school)?m.school:'霖霖'}));render();saveData(false)}
loadData();
document.getElementById('date').addEventListener('input',renderCopy);document.getElementById('time').addEventListener('input',renderCopy);
</script>
</body>
</html>
